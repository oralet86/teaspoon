[project]
name = "teaspoon"
version = "0.1.0"
description = "Experimental repository for research regarding metaheuristic optimization"
readme = "README.md"
authors = [
    { name = "oralet86", email = "mert.ficici86@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "ortools>=9.15.6755",
    "pyqtgraph>=0.14.0",
    "pyright>=1.1.411",
    "pyside6-essentials>=6.11.2",
    "rl4co>=0.7.0",
    "ruff>=0.16.4",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: runs the real model (slow); use `uv run pytest -m integration`",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
