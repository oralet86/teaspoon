[package]
name = "aos-rs"
version = "0.1.0"
edition = "2024"
description = "Operator-selection experiments for the symmetric TSP (Rust port of aos/)."
publish = false

[lib]
name = "aos"
path = "src/lib.rs"

[[bin]]
name = "aos"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.1.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
libc = "0.2.191"
log = "0.4.35"
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd"] }
rand_core = "0.10.1"
rand_xoshiro = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[build-dependencies]
sha2 = "0.11.1"
